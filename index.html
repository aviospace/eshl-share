<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Owl - Opening...</title>

    <!-- Open Graph Meta Tags for Rich Previews -->
    <meta property="og:title" content="List Owl">
    <meta property="og:description" content="Add items to your shopping list">
    <meta property="og:image" content="https://aviospace.github.io/eshl-share/og-image.png">
    <meta property="og:url" content="https://aviospace.github.io/eshl-share/">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="List Owl">
    <meta name="twitter:description" content="Add items to your shopping list">
    <meta name="twitter:image" content="https://aviospace.github.io/eshl-share/og-image.png">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .store-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .store-link {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
            min-width: 220px;
        }
        .store-link:hover {
            transform: scale(1.05);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🦉</div>
        <h1>Opening List Owl...</h1>
        <div class="spinner"></div>
        <p>If the app doesn't open automatically, you can install it:</p>
        <div class="store-links">
            <a href="https://apps.apple.com/app/list-owl/id6765713411" class="store-link">
                Download on the App Store
            </a>
            <a href="https://play.google.com/store/apps/details?id=space.avio.eshl" class="store-link">
                Get it on Google Play
            </a>
        </div>
    </div>

    <script>
        // Build the deep link from the URL params.
        // Preferred: ?c=<short code> -> eshl://share?c=<code> (payload stored server-side).
        // Legacy:    ?p=<base64>     -> eshl://share?payload=<base64> (inline payload).
        const urlParams = new URLSearchParams(window.location.search);
        const c = urlParams.get('c');
        const p = urlParams.get('p');

        let deepLink = null;
        if (c) {
            deepLink = 'eshl://share?c=' + encodeURIComponent(c);
        } else if (p) {
            deepLink = 'eshl://share?payload=' + encodeURIComponent(p);
        }

        if (deepLink) {
            // Attempt to open the app immediately, then retry once.
            window.location.href = deepLink;
            setTimeout(() => { window.location.href = deepLink; }, 500);

            // After 3 seconds, surface the install links more prominently.
            setTimeout(() => {
                document.querySelector('h1').textContent = 'Having trouble?';
                document.querySelector('p').textContent = "If the app didn't open, you may need to install it first:";
                document.querySelector('.spinner').style.display = 'none';
            }, 3000);
        } else {
            // No recognised param - show error
            document.querySelector('.icon').textContent = '⚠️';
            document.querySelector('h1').textContent = 'Invalid Link';
            document.querySelector('p').textContent = 'This sharing link is invalid or incomplete.';
            document.querySelector('.spinner').style.display = 'none';
        }
    </script>
</body>
</html>
